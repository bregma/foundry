[project]
name = "foundry"
version = "0.1.0"
description = "A tool to maintain a wiki"
readme = "README.md"
authors = [
    { name = "Stephen M. Webb", email = "stephen.webb@bregmasoft.ca" }
]
requires-python = ">=3.12"
dependencies = [
    "click>=8.5.0",
    "mwcleric>=0.10.7",
    "mwparserfromhell>=0.7.2",
    "pywikibot>=11.7.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
foundry = "foundry.cli.__main__:cli"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]

[tool.ruff]
line-length  = 118
indent-width = 4
lint.select = [ "ALL" ]
lint.ignore = [ "Q000", "D203", "D213", "D401", "T201" ]
